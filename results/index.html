<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Growth Path Results | The Growth Path</title>
<meta name="description" content="Your Growth Check results: context, what he needs most from you, and a preview of the members plan." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --sage-50: #f4f7f2;
    --sage-100: #e6ede1;
    --sage-300: #b8c9ac;
    --sage-500: #7d9b73;
    --sage-700: #4f6a4a;
    --sage-900: #2b3a29;
    --terra-300: #e8b39a;
    --terra-500: #cf7955;
    --terra-700: #a15837;
    --cream: #fbf7f1;
    --ink: #2a2723;
    --ink-soft: #5a5651;
    --line: #e5ded2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--cream);
    color: var(--ink);
    line-height: 1.6;
    font-size: 17px;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 {
    font-family: 'Fraunces', Georgia, serif;
    color: var(--sage-900);
    font-weight: 500;
    line-height: 1.15;
    letter-spacing: -0.01em;
  }
  h1 { font-size: 2rem; margin-bottom: 0.75rem; }
  h2 { font-size: 1.5rem; margin-bottom: 0.75rem; }
  h3 { font-size: 1.15rem; margin-bottom: 0.4rem; }
  p { margin-bottom: 1rem; color: var(--ink-soft); }
  a { color: var(--terra-700); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 1.25rem; }

  .nav {
    background: var(--cream);
    border-bottom: 1px solid var(--line);
    padding: 0.9rem 0;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .nav .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .nav .brand {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    color: var(--sage-900);
    text-decoration: none;
    font-size: 1.15rem;
  }
  .nav .links a {
    color: var(--sage-700);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    margin-left: 1rem;
  }
  .nav .links a:hover { color: var(--terra-700); }

  .hero { padding: 2rem 0 1rem; }
  .hero .eyebrow {
    font-size: 0.82rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--terra-700);
    font-weight: 600;
    margin-bottom: 0.5rem;
  }

  section { padding: 1.5rem 0; }

  .panel {
    background: white;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 1.75rem 1.5rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 2px 12px rgba(45, 58, 41, 0.04);
  }

  .datarow {
    display: flex;
    justify-content: space-between;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--line);
    color: var(--sage-900);
    font-size: 0.98rem;
  }
  .datarow:last-child { border-bottom: none; }
  .datarow .k { font-weight: 600; color: var(--sage-900); }
  .datarow .v { color: var(--ink-soft); }

  .band {
    background: var(--sage-100);
    padding: 1rem 1.15rem;
    border-radius: 12px;
    margin-top: 1rem;
    color: var(--sage-900);
  }
  .band strong { color: var(--sage-900); font-family: 'Fraunces', Georgia, serif; }

  .priority {
    background: var(--sage-50);
    border-left: 4px solid var(--terra-500);
    border-radius: 10px;
    padding: 1.25rem 1.35rem;
    margin-top: 0.5rem;
  }
  .priority .label {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--terra-700);
    font-weight: 600;
    margin-bottom: 0.35rem;
    display: block;
  }
  .priority h3 {
    font-family: 'Fraunces', Georgia, serif;
    color: var(--sage-900);
    margin-bottom: 0.6rem;
    font-size: 1.3rem;
  }
  .priority p { color: var(--ink-soft); margin-bottom: 0.75rem; font-size: 0.98rem; }
  .priority p:last-child { margin-bottom: 0; }

  .tiles {
    display: grid;
    gap: 0.85rem;
    margin-top: 1.25rem;
  }
  .tile {
    background: white;
    border: 1px solid var(--sage-300);
    border-radius: 12px;
    padding: 1rem 1.15rem;
  }
  .tile h4 {
    font-family: 'Fraunces', Georgia, serif;
    color: var(--sage-900);
    margin-bottom: 0.25rem;
    font-weight: 600;
    font-size: 1.02rem;
  }
  .tile p { font-size: 0.9rem; color: var(--ink-soft); margin: 0; }

  .cta-card {
    background: var(--sage-700);
    color: white;
    border-radius: 16px;
    padding: 2rem 1.75rem;
    text-align: center;
    margin-top: 1.5rem;
  }
  .cta-card h2 { color: white; margin-bottom: 0.6rem; font-size: 1.5rem; }
  .cta-card p { color: var(--sage-100); max-width: 30rem; margin: 0 auto 1.25rem; }
  .cta-card .trust {
    color: var(--sage-100);
    font-size: 0.9rem;
    margin-bottom: 1.25rem;
    font-style: italic;
  }
  .btn {
    display: inline-block;
    background: var(--terra-500);
    color: white;
    padding: 0.9rem 1.4rem;
    border-radius: 10px;
    font-weight: 600;
    text-decoration: none;
    border: none;
    cursor: pointer;
    font-size: 0.98rem;
    font-family: inherit;
    transition: background 0.15s ease;
  }
  .btn:hover { background: var(--terra-700); }

  .fallback {
    background: white;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 2rem 1.5rem;
    text-align: center;
  }
  .fallback a { font-weight: 600; }

  footer {
    background: var(--sage-900);
    color: var(--sage-100);
    padding: 2rem 0 1.5rem;
    text-align: center;
  }
  footer p { color: var(--sage-300); margin-bottom: 0.5rem; }
  footer a { color: var(--sage-100); text-decoration: underline; }
  footer .fine { margin-top: 1.25rem; font-size: 0.8rem; color: var(--sage-300); opacity: 0.75; }

  @media (min-width: 720px) {
    body { font-size: 18px; }
    h1 { font-size: 2.6rem; }
    .tiles { grid-template-columns: 1fr 1fr; }
  }
</style>
<link rel="canonical" href="https://thegrowthpath.app/results/" />
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a class="brand" href="/">The Growth Path</a>
    <div class="links">
      <a href="/growth-path/">Library</a>
      <a href="/growth-check/">Growth Check</a>
      <a href="/login/">Members</a>
    </div>
  </div>
</nav>

<div id="app"></div>

<footer>
  <div class="wrap">
    <p><a href="/growth-path/">Library</a> &nbsp;&middot;&nbsp; <a href="/join/">Membership</a></p>
    <div class="fine">
      The Growth Path is parent education, not medical advice. Always talk to a qualified pediatric provider about your son's growth. &copy; 2026 The Growth Path.
    </div>
  </div>
</footer>

<script>
(function(){
  const app = document.getElementById('app');
  let a = {};
  try { a = JSON.parse(localStorage.getItem('gpAnswers') || '{}'); } catch(e) {}

  const hasAny = a && (a.sonAge != null || a.sonHeightInches > 0 || a.pubertyTiming);
  if (!hasAny) {
    app.innerHTML = `
      <header class="hero"><div class="wrap">
        <div class="eyebrow">Growth Check</div>
        <h1>No answers found.</h1>
        <p>Start the Growth Check to see your results here.</p>
      </div></header>
      <section><div class="wrap"><div class="fallback">
        <p><a href="/growth-check/" class="btn">Start Your Growth Check</a></p>
      </div></div></section>`;
    return;
  }

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtIn(totalIn) {
    if (!totalIn || totalIn <= 0 || isNaN(totalIn)) return '';
    const f = Math.floor(totalIn / 12);
    const i = Math.round(totalIn - f * 12);
    return f + '&#39;' + i + '&quot;';
  }

  const name = (a.sonName || '').trim();
  const nameOr = name || 'Your son';
  const heHim = 'him';
  const hisHer = name ? name + "'s" : "your son's";

  const curIn = Number(a.sonHeightInches) || 0;
  const momIn = Number(a.momHeightInches) || 0;
  const dadIn = Number(a.dadHeightInches) || 0;

  // Mid-parental for a boy: ((mom_in + 5) + dad_in) / 2, +/- 4 in
  let mpBand = null;
  if (momIn >= 40 && dadIn >= 40) {
    const mid = ((momIn + 5) + dadIn) / 2;
    mpBand = { low: mid - 4, high: mid + 4, mid };
  }

  const triggers = Array.isArray(a.attentionTriggers) ? a.attentionTriggers : [];
  const pt = a.pubertyTiming;
  const love = a.sonLove;

  // Priority logic
  let priority;
  if (pt === 'later' && (triggers.includes('sports') || triggers.includes('peer'))) {
    priority = {
      key: 'monitoring',
      title: 'Monitoring',
      lead: 'Watch, track, and know when the pattern justifies action.',
      body: [
        'The combination you described (development tracking later than peers, and the noticing showing up in ' + (triggers.includes('sports') && triggers.includes('peer') ? 'both sports and peer comparison' : (triggers.includes('sports') ? 'sports settings' : 'peer comparison')) + ') is a real signal, and it deserves a real system. Not a spreadsheet you look at once. A rhythm.',
        'What that looks like: a consistent measurement every three to six months, same conditions each time. A note on where he sits in his own curve, not just where he sits on the chart. And a clear internal threshold for when the trend is worth a pediatrician conversation rather than a wait-and-see.',
        'You are not being paranoid. You are building the record that lets you act with confidence if the moment comes.'
      ]
    };
  } else if (triggers.includes('pediatrician') || triggers.includes('family')) {
    priority = {
      key: 'medical',
      title: 'Medical clarity',
      lead: 'Understand whether specialist evaluation is warranted, and what to ask.',
      body: [
        (triggers.includes('pediatrician') ? 'A pediatrician has already flagged something.' : 'Family history is meaningful clinical context.') + ' That moves this from a general question into a specific one, and specific questions get better answers.',
        'What that looks like: request a printed copy of his growth chart, come to the next visit with prepared questions about velocity and bone age, and ask directly whether a referral to a pediatric endocrinologist is reasonable. You are not asking for a diagnosis. You are asking whether the picture warrants a specialist read.',
        'Bring context, not conclusions. Your job in the room is to make sure the right questions get asked.'
      ]
    };
  } else if (triggers.includes('confidence')) {
    priority = {
      key: 'confidence',
      title: 'Confidence support',
      lead: 'Give him the words and the framing he needs to navigate this stage with intact self-worth.',
      body: [
        'When his own confidence is what pulled you in, the medical piece is not what he needs from you first. He needs to feel seen without feeling fixed.',
        'What that looks like: name what he is feeling before you problem-solve it. Talk about what his body can do, not what it measures. Keep your language matter-of-fact, because he will learn how to talk about his body from how you talk about it. And when he brings a hard moment home, sit with it before you try to reframe it.',
        'This is the work that shapes the man he becomes, regardless of what the growth chart eventually shows.'
      ]
    };
  } else {
    priority = {
      key: 'monitoring',
      title: 'Monitoring',
      lead: 'Watch, track, and know when the pattern justifies action.',
      body: [
        'You are early enough in this that the most valuable thing you can do is build a real record, so future-you has something to work with.',
        'What that looks like: a consistent measurement every three to six months in the same conditions, a note on where he sits in his own curve rather than just the chart, and a clear internal threshold for when the trend is worth a pediatrician conversation.',
        'This is not a wait-and-worry stance. It is a wait-and-see stance with the evidence in hand.'
      ]
    };
  }

  // Constitutional delay note
  let cdgpNote = '';
  if (pt === 'later' && (triggers.includes('sports') || triggers.includes('confidence') || triggers.includes('peer'))) {
    cdgpNote = `
      <div class="band">
        <strong>A note on late development.</strong>
        <p style="margin-top:0.5rem; margin-bottom: 0; color: var(--sage-900);">
        Constitutional growth delay is a common, often benign pattern where boys enter puberty later than peers and complete growth on a delayed timeline. A pediatric endocrinologist can help evaluate whether that pattern fits. See the
        <a href="https://www.endocrine.org/patient-engagement/endocrine-library/short-stature-in-children" target="_blank" rel="noopener">Endocrine Society patient guide</a> for context.
        </p>
      </div>`;
  }

  // Personalization: quiet reference to what she loves about him
  const loveMap = {
    kindness: 'his kindness',
    humor: 'his sense of humor',
    determination: 'his determination',
    confidence: 'his quiet confidence',
    caring: 'how he cares for others',
    other: (a.sonLoveOther || '').trim()
  };
  const loveText = loveMap[love] || '';

  const introLine = name
    ? "Here is what we can see about " + esc(name) + " from your answers."
    : "Here is what we can see about your son from your answers.";

  const emotionalBeat = loveText
    ? `<p style="margin-top:0.5rem; font-style: italic; color: var(--sage-700);">You told us what you love most is ${esc(loveText)}. Hold onto that. It is the ground this whole conversation stands on.</p>`
    : '';

  const curDisp = curIn > 0 ? fmtIn(curIn) : '';
  const momDisp = momIn > 0 ? fmtIn(momIn) : '';
  const dadDisp = dadIn > 0 ? fmtIn(dadIn) : '';
  const mpDisp = mpBand ? (fmtIn(mpBand.low) + ' to ' + fmtIn(mpBand.high)) : '';

  const priorityHeading = name
    ? "What " + esc(name) + " Needs Most from You"
    : "What Your Son Needs Most from You";

  const html = `
    <header class="hero">
      <div class="wrap">
        <div class="eyebrow">${name ? esc(name) + "'s" : "Your"} Growth Check</div>
        <h1>${introLine}</h1>
        <p>This is context to help you think, not a diagnosis. Save your results and share them with your pediatrician if it is useful.</p>
        ${emotionalBeat}
      </div>
    </header>

    <section>
      <div class="wrap">
        <div class="panel">
          <h2>Growth context</h2>
          <div class="datarow"><span class="k">Age</span><span class="v">${a.sonAge != null && a.sonAge !== '' ? esc(a.sonAge) + ' yrs' : '-'}</span></div>
          <div class="datarow"><span class="k">Current height</span><span class="v">${curDisp || '-'}</span></div>
          <div class="datarow"><span class="k">Mom's height</span><span class="v">${momDisp || '-'}</span></div>
          <div class="datarow"><span class="k">Dad's height</span><span class="v">${dadDisp || '-'}</span></div>
          ${mpDisp ? `<div class="datarow"><span class="k">Family-context range</span><span class="v">${mpDisp}</span></div>` : ''}
          ${mpDisp ? `<div class="band"><strong>What the range means.</strong><p style="margin-top:0.5rem; margin-bottom:0; color: var(--sage-900);">This is context, not a prediction. It is a rough family window based on parent heights (a common rule of thumb: mother's height plus five, plus father's height, divided by two, then plus or minus four inches). His actual adult height depends on many factors and can land anywhere in or near this range.</p></div>` : ''}
          ${cdgpNote}
        </div>

        <div class="panel">
          <h2>${priorityHeading}</h2>
          <div class="priority">
            <span class="label">Your priority right now</span>
            <h3>${esc(priority.title)}</h3>
            <p><strong style="color: var(--sage-900);">${esc(priority.lead)}</strong></p>
            ${priority.body.map(p => `<p>${p}</p>`).join('')}
          </div>
        </div>

        <div class="panel">
          <h2>${name ? esc(name) + "'s" : 'Your'} Growth Path</h2>
          <p>Members get the tools that turn a snapshot into a plan you can actually use.</p>
          <div class="tiles">
            <div class="tile"><h4>Living growth record</h4><p>Log measurements over time and see the shape of his curve.</p></div>
            <div class="tile"><h4>Personalized what-to-monitor plan</h4><p>Clear signals to watch for, matched to his age and stage.</p></div>
            <div class="tile"><h4>Pediatrician appointment prep</h4><p>Printable growth chart, questions to ask, red flags to name.</p></div>
            <div class="tile"><h4>Confidence and communication guides</h4><p>What to say at 8, 12, 16. The week he sits the bench.</p></div>
            <div class="tile"><h4>Evidence-based resource library</h4><p>Reviewed reading on late bloomers, bone age, and more.</p></div>
            <div class="tile"><h4>Weekly guidance emails</h4><p>Short, useful, and never a supplement pitch.</p></div>
          </div>

          <div class="cta-card">
            <h2>Become a Founding Member</h2>
            <p>Keep your founding rate as long as your membership stays active. Cancel anytime.</p>
            <div class="trust">Every claim reviewed. No supplements. No fake diagnoses.</div>
            <a href="/join/" class="btn">Become a Founding Member for $19/month</a>
          </div>
        </div>
      </div>
    </section>
  `;

  app.innerHTML = html;
})();
</script>
</body>
</html>
